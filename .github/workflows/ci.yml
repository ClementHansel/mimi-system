name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  build:
    name: Install, build, lint, test
    runs-on: ubuntu-latest
    # A live Postgres, not just the separate "db" job's — the RLS-bypass
    # regression test (apps/backend/src/common/guards/rls-context.guard.live-db.regression.spec.ts,
    # and any future test like it) `describe.skipIf(!process.env.DATABASE_URL)`s
    # when it can't reach a database. Before this service existed here, that
    # spec silently skipped in every CI run and only ever executed on a
    # developer's laptop — the exact "looks like passing software, isn't"
    # failure shape as D-22 itself (see .env.example's D-21/D-22 comment).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          TZ: Asia/Makassar
          PGTZ: Asia/Makassar
          POSTGRES_DB: mimi
          POSTGRES_USER: mimi
          POSTGRES_PASSWORD: mimi_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimi -d mimi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # apps/backend/test/app-boot.spec.ts compiles the real AppModule and
      # runs init() — the same graph main.ts builds. RedisModule is @Global
      # and its ioredis client is constructed eagerly (lazyConnect: false)
      # as part of that graph, so without a reachable Redis here the boot
      # test either hangs on connection retries or the client emits an
      # unhandled 'error' event. Same class of gap as the postgres service
      # above: without this, the boot test would flake or silently never
      # exercise the real connection path.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TZ: Asia/Makassar
      PGTZ: Asia/Makassar
      # Two identities, same as production (D-21/D-22) — never collapse
      # these into one. DATABASE_URL is what app code and the live-DB specs
      # read (mimi_app: non-superuser, RLS-enforced — the actual runtime
      # path, not a hand-issued SET ROLE). DATABASE_MIGRATION_URL is the
      # owner connection @mimi/database's migrate/seed/reset scripts use to
      # create and own schema objects, including the migration that creates
      # the mimi_app role itself (database/migrations/203_w1c_app_login_role.sql).
      DATABASE_URL: postgres://mimi_app:mimi_app_secret@localhost:5432/mimi
      DATABASE_MIGRATION_URL: postgres://mimi:mimi_secret@localhost:5432/mimi
      # Required by app-boot.spec.ts (see redis service above) — matches the
      # RedisClientProvider default host/port, pointed at the service container.
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Guards against the exact incident this repo hit: a misplaced tsc
      # incremental cache (tsBuildInfoFile outside dist/) let `nest
      # build`/`tsc` exit 0 while emitting zero files, because the cache
      # said "up to date" against a dist/ that had just been wiped. `pnpm
      # build` above would have reported success either way — this is the
      # assertion whose absence let that ship. Fail loudly instead.
      - name: Verify build actually produced output
        run: |
          set -e
          fail=0
          if [ ! -s apps/backend/dist/main.js ]; then
            echo "::error::apps/backend/dist/main.js is missing or empty — build silently emitted nothing"
            fail=1
          fi
          if [ -z "$(find packages/shared/dist -name '*.js' -print -quit 2>/dev/null)" ]; then
            echo "::error::packages/shared/dist has no compiled output — build silently emitted nothing"
            fail=1
          fi
          if [ -z "$(find packages/sync-protocol/dist -name '*.js' -print -quit 2>/dev/null)" ]; then
            echo "::error::packages/sync-protocol/dist has no compiled output — build silently emitted nothing"
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "Build guard OK: backend dist/main.js and sibling package dist/ are populated."

      - name: Lint
        run: pnpm lint

      # The build config excludes *.spec.ts/*.test.ts (they are never emitted),
      # which quietly meant they were never TYPE-CHECKED either. 202 errors had
      # accumulated behind that, and some were real: a mis-typed harness made
      # TypeScript infer `unknown` and void ~105 assertions in one spec; a mock
      # declared with the wrong arity made every SQL-parameter assertion in
      # another an out-of-bounds index that could not fail. Gated here so the
      # hole cannot silently reopen.
      - name: Typecheck tests
        run: pnpm --filter @mimi/backend typecheck:tests

      - name: Format check
        run: pnpm format:check

      - name: Check for migrations
        id: migrations
        run: |
          count=$(find database/migrations -maxdepth 1 -name '*.sql' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count migration file(s) in database/migrations"

      - name: Run migrations (owner connection — creates mimi_app, D-21)
        if: steps.migrations.outputs.count != '0'
        run: pnpm db:migrate

      - name: Run seed (owner connection)
        if: steps.migrations.outputs.count != '0'
        run: pnpm db:seed

      # Turns "a required env var is silently missing so the test just
      # doesn't run" into a loud, unmissable CI failure — the general form
      # of the D-22 lesson, not just a one-off fix for today's file. Any
      # future `describe.skipIf(!process.env.SOME_VAR)` live-DB spec is
      # covered automatically: this scans for the pattern rather than
      # naming today's file.
      - name: Verify live-DB specs will not silently skip
        if: always() && steps.migrations.outputs.count != '0'
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t files < <(grep -rlE "skipIf\(!process\.env\.[A-Z_]+\)" --include="*.spec.ts" apps packages database 2>/dev/null || true)
          count=${#files[@]}

          {
            echo "### Live-DB-gated test specs"
            echo
            if [ "$count" -eq 0 ]; then
              echo "None found in this checkout."
            else
              echo "Found $count file(s) that skip without a live database. This job provisions postgres and runs migrate+seed, so every one of these is expected to **execute**, not skip:"
              echo
              for f in "${files[@]}"; do
                echo "- \`$f\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          missing=0
          for f in "${files[@]}"; do
            vars=$(grep -oE "skipIf\(!process\.env\.[A-Z_]+\)" "$f" | grep -oE "[A-Z_]+\)" | tr -d ')')
            for v in $vars; do
              val="${!v:-}"
              if [ -z "$val" ]; then
                echo "::error file=$f::Live-DB spec requires \$$v, which is not set in this job — it would silently SKIP instead of running. This is the exact failure shape D-22 exists to prevent: a missing check that reports green."
                missing=1
              fi
            done
          done

          if [ "$missing" -eq 1 ]; then
            echo "::error::One or more live-DB-gated specs would silently skip in this job — see annotations above. Failing loudly instead of letting CI report green with a gap."
            exit 1
          fi

          echo "All $count live-DB-gated spec file(s) have their required env var(s) set in this job — none will silently skip."

      - name: Test
        run: pnpm test

  db:
    name: Migrations + seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          TZ: Asia/Makassar
          PGTZ: Asia/Makassar
          POSTGRES_DB: mimi
          POSTGRES_USER: mimi
          POSTGRES_PASSWORD: mimi_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimi -d mimi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # This job only ever runs migrate+seed, never the backend, so it needs
      # the OWNER connection (D-21/D-22) — @mimi/database's scripts read
      # DATABASE_MIGRATION_URL, not DATABASE_URL (that's the runtime/mimi_app
      # var the backend uses, which this job never touches).
      DATABASE_MIGRATION_URL: postgres://mimi:mimi_secret@localhost:5432/mimi
      TZ: Asia/Makassar
      PGTZ: Asia/Makassar
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for migrations
        id: migrations
        run: |
          count=$(find database/migrations -maxdepth 1 -name '*.sql' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count migration file(s) in database/migrations"

      - name: Run migrations
        if: steps.migrations.outputs.count != '0'
        run: pnpm db:migrate

      - name: Run seed
        if: steps.migrations.outputs.count != '0'
        run: pnpm db:seed

      - name: Skip notice
        if: steps.migrations.outputs.count == '0'
        run: echo "::notice::database/migrations is still empty — skipping migrate+seed until senior-db (W1-C) lands them."

  # ───────────────────────────────────────────────────────────────────────────
  # THE WRITE FLOWS, against a stack this job boots and throws away.
  #
  # WHY THIS EXISTS. The e2e suite has specs that raise a replenishment,
  # approve it, and ring a sale — the operations the business actually runs —
  # and until this job they were executed by nobody. They are gated on
  # `E2E_ALLOW_WRITES=1` because they must never run against production, and the
  # only workflow that set that flag (deploy-vps.yml) was retired as an
  # automatic deploy on 2026-08-30 and now fires only on workflow_dispatch. The
  # specs covered the write paths; the pipeline did not run them.
  #
  # An EPHEMERAL stack is the right home for them: nothing here is anyone's
  # data, so a test may submit freely, and the database dies with the runner.
  # That is the difference between this job and the post-deploy smokes, which
  # are read-only precisely because the box they hit belongs to a real
  # business.
  #
  # It duplicates install+build rather than depending on `build`, on purpose:
  # a red write-flow job should never be ambiguous about whether the build was
  # the problem, and artifact-passing between jobs costs about what rebuilding
  # does here.
  # ───────────────────────────────────────────────────────────────────────────
  e2e-write:
    name: Write flows (ephemeral stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          TZ: Asia/Makassar
          PGTZ: Asia/Makassar
          POSTGRES_DB: mimi
          POSTGRES_USER: mimi
          POSTGRES_PASSWORD: mimi_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimi -d mimi" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      TZ: Asia/Makassar
      PGTZ: Asia/Makassar
      DATABASE_URL: postgres://mimi_app:mimi_app_secret@localhost:5432/mimi
      DATABASE_MIGRATION_URL: postgres://mimi:mimi_secret@localhost:5432/mimi
      REDIS_URL: redis://localhost:6379
      # Any value works — nothing outside this runner will ever verify a token
      # it signed. Written explicitly rather than left to a default so a
      # missing-secret crash cannot be mistaken for a test failure.
      JWT_SECRET: ci-only-not-a-secret
      JWT_REFRESH_SECRET: ci-only-not-a-secret-refresh
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BACKEND_PORT: 4000
      # The frontend proxies `/api` here. Without this it defaults to
      # `http://backend:4000` under NODE_ENV=production (the compose service
      # name), which does not resolve on a runner — every proxied call would
      # die as an opaque 500.
      BACKEND_ORIGIN: http://localhost:4000
      NEXT_PUBLIC_API_URL: /api

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run migrations
        run: pnpm db:migrate

      - name: Run seed
        run: pnpm db:seed

      - name: Apply the org model
        # The crew accounts the ops specs sign in as (`spv_bpp01_p`,
        # `kasir_bpp01_p`, `koki1_bpp01_p`) are created by `simulate:org`, NOT
        # by the base seed — it RENAMES the provisional logins seed.ts makes
        # (`spv_bpp01` → `spv_bpp01_p`). Without this step every ops spec fails
        # at the login screen for a reason that looks nothing like the cause.
        run: pnpm --filter @mimi/database simulate:org

      - name: Start the backend
        run: |
          node apps/backend/dist/main.js > /tmp/backend.log 2>&1 &
          echo "waiting for the backend"
          for i in $(seq 1 60); do
            # `/health`, NOT `/api/health`. `main.ts` EXCLUDES health from the
            # global `/api` prefix (same reason `/sync/v1` is excluded — a probe
            # should need no knowledge of the REST prefix), so `/api/health`
            # 404s on a perfectly healthy backend. `-f` makes curl fail on that
            # 404, which is what turns the wrong path into a 120-second wait and
            # then a red job. Verified against a running backend, not assumed.
            if curl -sf -o /dev/null http://localhost:4000/health; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::the backend never answered on :4000"
          tail -80 /tmp/backend.log
          exit 1

      - name: Start the frontend
        run: |
          pnpm --filter @mimi/frontend exec next start --port 3000 \
            > /tmp/frontend.log 2>&1 &
          echo "waiting for the frontend"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then
              echo "frontend is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::the frontend never answered on :3000"
          tail -80 /tmp/frontend.log
          exit 1

      - name: Install Playwright Chromium
        run: pnpm --filter @mimi/e2e exec playwright install --with-deps chromium

      - name: Run the write flows
        env:
          E2E_BASE_URL: http://localhost:3000
          # THE WHOLE POINT OF THIS JOB. Safe here and nowhere else: this
          # database was created four steps ago and dies with the runner.
          #
          # `form-validation-sweep` is gated for a subtler reason than the
          # others: it only ever submits an EMPTY form, but a form whose fields
          # are all optional would accept that and create a row. It cannot know
          # in advance which forms those are, so it belongs here and never
          # against a live box. Its read-only sibling `form-sweep` runs in the
          # post-deploy smokes instead.
          E2E_ALLOW_WRITES: '1'
        run: |
          pnpm --filter @mimi/e2e exec playwright test \
            tests/ops-supply-chain.spec.ts tests/ops-pos-day.spec.ts \
            tests/purchasing.spec.ts tests/outlet-request.spec.ts \
            tests/ops-role-reality.spec.ts tests/form-validation-sweep.spec.ts \n            tests/ops-purchasing.spec.ts

      - name: Server logs when it fails
        if: failure()
        run: |
          echo "── backend ──"; tail -120 /tmp/backend.log || true
          echo "── frontend ──"; tail -60 /tmp/frontend.log || true

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-write-report
          path: e2e/playwright-report
          retention-days: 7
