# Deploy Mimi Chicken OS to the shared production VPS on every push to main.
#
# The server holds seven unrelated compose projects. Every command below is
# scoped to `-p mimi` and to /home/ubuntu/mimi so a deploy can only ever touch
# this stack. Nothing here prunes images, prunes volumes, or restarts the
# Docker daemon — all three would hit the neighbours.
name: deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A second push while a deploy is mid-build would have two `compose up` runs
# racing on the same project. Queue them instead, and never cancel a running
# deploy — a half-applied stack is worse than a slightly stale one.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Open SSH session
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust the host key
        # Pinned from the known_hosts secret rather than blind-accepting, so a
        # DNS or routing hijack cannot silently redirect a deploy (with its
        # keys) to someone else's machine.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and rebuild
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$USER@$HOST" bash -euo pipefail <<'REMOTE'
            cd /home/ubuntu/mimi

            # .env.vps holds the generated production secrets and lives ONLY on
            # the server — it is gitignored and never travels through CI.
            test -f .env.vps || { echo "::error::.env.vps missing on server"; exit 1; }

            git fetch --prune origin main
            git reset --hard origin/main

            # TLS (B-14): a self-signed certificate, generated HERE and never in
            # git — a committed private key is a published private key. Created
            # once and reused, so a redeploy does not invalidate the exception a
            # tester already accepted in their browser.
            #
            # SAN carries the bare IP as well as the CN, because this box has no
            # hostname yet: without `IP:` in subjectAltName, browsers reject the
            # cert outright instead of offering the "accept anyway" that makes
            # the origin a secure context.
            mkdir -p /home/ubuntu/mimi/certs
            if [ ! -f /home/ubuntu/mimi/certs/mimi.crt ]; then
              openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
                -keyout /home/ubuntu/mimi/certs/mimi.key \
                -out /home/ubuntu/mimi/certs/mimi.crt \
                -subj "/CN=150.109.15.108/O=Mimi Chicken OS/C=ID" \
                -addext "subjectAltName=IP:150.109.15.108,DNS:localhost" \
                -addext "keyUsage=digitalSignature,keyEncipherment" \
                -addext "extendedKeyUsage=serverAuth"
              chmod 600 /home/ubuntu/mimi/certs/mimi.key
              echo "generated a self-signed certificate"
            else
              echo "certificate already present — reusing it"
            fi

            # Apply pending migrations BEFORE rebuilding. Missing this step meant
            # migration 220 (an RLS fix) sat unapplied while the code that assumed
            # it shipped — the stack would come up "healthy" and quietly behave as
            # though the fix were not there. The runner is disposable: it only
            # needs the database package's deps, on the compose network.
            set -a; . ./.env.vps; set +a
            docker run --rm --network mimi_mimi-network \
              -v /home/ubuntu/mimi:/app -w /app/database \
              -e DATABASE_MIGRATION_URL="$DATABASE_MIGRATION_URL" \
              -e DATABASE_URL="$DATABASE_URL" \
              node:22-alpine sh -c \
              'corepack enable >/dev/null 2>&1 && corepack prepare pnpm@9.15.4 --activate >/dev/null 2>&1 && pnpm migrate'

            docker compose -p mimi \
              -f docker-compose.yml -f docker-compose.vps.yml \
              --env-file .env.vps \
              up -d --build --remove-orphans

            # --remove-orphans is scoped to project `mimi` by -p, so it can only
            # remove containers this stack previously created.
          REMOTE

      - name: Verify TLS answers alongside HTTP
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        # HTTP is the fallback and its failure is fatal; HTTPS failing is loud
        # but NOT fatal, because a TLS misconfiguration must never be able to
        # take a working box offline — the whole reason 8080 was kept.
        run: |
          ssh "$USER@$HOST" bash -euo pipefail <<'REMOTE'
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 http://127.0.0.1:8080/ || echo 000)
            echo "HTTP  :8080 -> $http_code"
            [ "$http_code" = "200" ] || { echo "::error::plain HTTP is down"; exit 1; }

            # -k: the certificate is self-signed by design, so curl must not
            # judge it. This checks the terminator and the proxy path, not trust.
            #
            # Retried for ~30s rather than probed once: the first attempt checked
            # two seconds after `Started` and could not tell "nginx is still
            # warming up" from "nginx is dead". Both looked like 000.
            https_code=000
            for attempt in 1 2 3 4 5 6; do
              https_code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1:8443/ || echo 000)
              [ "$https_code" = "200" ] && break
              sleep 5
            done
            echo "HTTPS :8443 -> $https_code"
            if [ "$https_code" != "200" ]; then
              echo "::warning::HTTPS did not answer 200 (got $https_code) — HTTP is still serving; check the tls container"
              # `mimi-tls`, matching the container_name the overlay now sets. The
              # first version grepped a name Compose had not assigned, so the one
              # diagnostic that would have explained the failure printed nothing.
              docker logs --tail 40 mimi-tls 2>&1 || docker ps -a --filter name=tls
            fi
          REMOTE

      - name: Refresh reporting rollups
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        # The dashboard reads materialized views, not the base tables. Migrations
        # create and refresh them while the database is still EMPTY, and the seed
        # loads data afterwards — so on a fresh deploy every figure renders as
        # Rp0 / 0 transactions against a database that is in fact full. That is
        # the worst kind of wrong: it looks like a working system reporting a
        # terrible week, not like a broken one.
        run: |
          ssh "$USER@$HOST" bash -euo pipefail <<'REMOTE'
            for v in mv_sales_daily mv_item_usage_daily mv_employee_kpi_daily mv_delivery_recap_daily; do
              docker exec mimi-postgres psql -U mimi -d mimi -v ON_ERROR_STOP=1 \
                -tAc "REFRESH MATERIALIZED VIEW CONCURRENTLY ${v}" >/dev/null
              echo "refreshed ${v}"
            done
          REMOTE

      - name: Verify the stack answers
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$USER@$HOST" bash -euo pipefail <<'REMOTE'
            cd /home/ubuntu/mimi
            port="$(grep -E '^FRONTEND_PUBLIC_PORT=' .env.vps | cut -d= -f2)"

            # Poll rather than sleep-then-check: a cold build can take a while
            # to become healthy, and a fixed sleep either wastes time or lies.
            for i in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/login" || true)"
              if [ "$code" = "200" ]; then echo "frontend OK after ${i}0s"; exit 0; fi
              sleep 10
            done

            echo "::error::frontend did not return 200 within 5 minutes"
            docker compose -p mimi logs --tail 40 frontend backend
            exit 1
          REMOTE

  # ── B-9: the e2e suite finally runs somewhere other than a laptop ──────────
  #
  # It runs AFTER the deploy, against the box that was just deployed, and it
  # cannot "fail the deploy" — the stack is already live by the time this
  # starts. What it can do is fail the RUN, loudly and on the commit that
  # caused it, which is the honest shape for a post-deploy check. Rolling back
  # automatically was considered and rejected: this stack has one shared
  # database and no blue/green, so an automatic rollback would be a second
  # unattended change on top of a bad one.
  #
  # SCOPE — a smoke subset, not all 41 specs. `hub` and `session-recovery`
  # between them cover the two failures that have actually reached the deployed
  # box: a blank white page from a half-valid session, and the hub rendering
  # the wrong surfaces for a role. `print` is included because both printable
  # documents are reached through real buttons and it is the cheapest proof
  # that an authenticated non-trivial page still renders. The heavier journeys
  # stay a manual `pnpm e2e` run: several mutate demo data, and a suite that
  # quietly rewrites the demo box on every push is worse than one nobody runs.
  e2e-smoke:
    name: Post-deploy e2e smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only. Both Playwright projects (`desktop` = Desktop Chrome,
      # `mobile` = Pixel 7) are Chromium-based, so nothing else is ever
      # launched, and installing three browsers to use one costs minutes of CI
      # time on every deploy.
      - name: Install Playwright Chromium
        run: pnpm --filter @mimi/e2e exec playwright install --with-deps chromium

      - name: Smoke the deployed box
        env:
          # Same public URL the owner uses. Kept in a secret rather than
          # hardcoded so moving the box (or finally getting a domain — B-14)
          # does not need a workflow edit.
          E2E_BASE_URL: ${{ secrets.VPS_PUBLIC_URL }}
        run: |
          if [ -z "${E2E_BASE_URL:-}" ]; then
            echo "::error::VPS_PUBLIC_URL secret is not set — the smoke would" \
                 "silently run against localhost and pass with nothing served."
            exit 1
          fi
          pnpm --filter @mimi/e2e exec playwright test \
            tests/hub.spec.ts tests/session-recovery.spec.ts tests/print.spec.ts

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-report
          path: e2e/playwright-report
          retention-days: 7
