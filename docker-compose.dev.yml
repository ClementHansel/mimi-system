# =============================================================================
# Mimi Chicken OS — DEVELOPMENT / LOCAL-TEST overlay
# =============================================================================
# Apply on top of the base for local work:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What it changes vs the base file:
#   - App images explicitly build the `development` stage (hot-reload: `pnpm dev`).
#   - Host source is bind-mounted in so edits reload without a rebuild.
#   - NODE_ENV=development, WA_ENABLED defaults to false (mock/wa_outbox — no
#     real WhatsApp gateway credentials needed for local dev, RISK-P4).
#   - branch-node runs standalone with SIMULATE=true (no hardware, no LAN).
# =============================================================================

services:
  backend:
    build:
      target: development
    environment:
      NODE_ENV: development
      WA_ENABLED: ${WA_ENABLED:-false}
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages:/app/packages

  frontend:
    build:
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./packages:/app/packages

  # Optional Tier-2 branch-node, hardware-free. Bring up explicitly:
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile branch-node up -d branch-node
  branch-node:
    build:
      context: .
      dockerfile: ./apps/branch-node/Dockerfile
      target: development
    container_name: mimi-branch-node
    restart: unless-stopped
    profiles:
      - branch-node
    environment:
      NODE_ENV: development
      TZ: ${TZ:-Asia/Makassar}
      SIMULATE: "true"
      BRANCH_NODE_CLOUD_URL: ${BRANCH_NODE_CLOUD_URL:-http://backend:4000}
      BRANCH_NODE_PAIRING_TOKEN: ${BRANCH_NODE_PAIRING_TOKEN:-simulate-token}
      BRANCH_NODE_HEALTH_PORT: 4010
    ports:
      - "127.0.0.1:${BRANCH_NODE_PORT:-4010}:4010"
    volumes:
      - ./apps/branch-node/src:/app/apps/branch-node/src
      - ./packages:/app/packages
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mimi-network
