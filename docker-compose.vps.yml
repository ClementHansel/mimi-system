# Mimi Chicken OS — overlay for the SHARED production VPS (150.109.15.108).
#
# This box already runs seven unrelated compose projects (aire, arka-villa,
# bambusilver, bfs, free-tax-return-preview, gaiada-social, deploy-test) and
# roughly 26 containers. The brief was explicit: deploy without disturbing any
# of them. Everything here exists to honour that.
#
#   Usage:
#     docker compose -p mimi \
#       -f docker-compose.yml -f docker-compose.vps.yml \
#       --env-file .env.vps up -d --build
#
# Three deliberate choices:
#
# 1. ONE public port. Only the frontend is published on the host, because
#    Next's rewrites already proxy /api and /sync/v1 to the backend over the
#    internal `mimi-network`. Postgres, Redis, MinIO and the backend stay on
#    127.0.0.1 (as the base file has them) with a port block verified free on
#    this host — see .env.vps. Nothing this stack publishes can collide with a
#    neighbour, and no database is reachable from outside the box.
#
# 2. NO Traefik. docker-compose.prod.yml puts Traefik on :80/:443 with
#    Let's Encrypt, which needs a real hostname pointed at this server. Until
#    there is one, that file cannot be used here. Ports 80/443 are in fact free
#    on this host today, but only because aire's nginx has been crash-looping
#    since 30 July — claiming them would quietly take over a port a neighbour
#    still believes it owns. Switching to the prod file later is the upgrade
#    path; see the note at the bottom.
#
# 3. Explicit log limits on EVERY service. This host has no
#    /etc/docker/daemon.json, so container logs grow without bound — one
#    neighbour has already produced a single 3.1 GB log file. The fix at the
#    daemon level would restart every container on the box, so instead each
#    service here caps its own logs. Mimi cannot become the next disk problem.

services:
  postgres:
    logging: &vps-logging
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  redis:
    logging: *vps-logging

  minio:
    logging: *vps-logging

  # n8n only exists to drive WhatsApp automation, and WA_ENABLED is false here.
  # Assigning it a profile that is never activated keeps it out of the stack
  # instead of leaving a permanently-unhealthy container on a shared box.
  n8n:
    profiles: ['wa']

  backend:
    build:
      target: production
    # The base file is the DEV stack: it builds `target: development` and bind-
    # mounts the source over the image, so the container runs `tsc --watch`
    # against sources whose workspace deps (@mimi/shared, @mimi/sync-protocol)
    # were never built — 326 type errors and a never-healthy container.
    # `volumes: []` drops those mounts so the compiled image is actually used.
    volumes: []
    environment:
      NODE_ENV: production
    logging: *vps-logging

  frontend:
    build:
      target: production
    volumes: []
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      PORT: '3000'
      # Same-origin: the browser only ever talks to this container, whose Next
      # rewrites proxy /api and /sync/v1 to the backend over mimi-network. That
      # is why no backend port needs publishing at all.
      NEXT_PUBLIC_API_URL: /api
    # The single public entry point. Host port comes from FRONTEND_PUBLIC_PORT
    # so it can be moved without editing this file; 0.0.0.0 is required because
    # the base file's 127.0.0.1 binding would make it unreachable off-box.
    ports:
      - '0.0.0.0:${FRONTEND_PUBLIC_PORT:-8080}:3000'
    logging: *vps-logging

  # TLS terminator (B-14). A browser refuses geolocation, camera and service
  # workers on an insecure origin, which kills three SHIPPED features on the
  # HTTP port: driver truck tracking, attendance selfie + GPS, and PWA install
  # on the outlet tablets. This puts the same frontend behind HTTPS.
  #
  # ON A HIGH PORT, deliberately — see choice 2 above. :443 is free on this host
  # only because a neighbour's nginx is crash-looping; claiming it would break
  # them the moment they fix it. 8443 costs an ugly URL and touches nobody.
  #
  # The certificate is SELF-SIGNED and generated on the host at deploy time
  # (deploy-vps.yml), never committed — a private key in git is a private key
  # published. Browsers warn once; after accepting, the origin is a secure
  # context, which is the whole point.
  tls:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
    volumes:
      - ./infrastructure/tls/nginx-tls.conf:/etc/nginx/conf.d/mimi-tls.conf:ro
      # `map` cannot live in a conf.d server file, so the upgrade map is written
      # as its own http-level snippet by the deploy step.
      - ./infrastructure/tls/upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - /home/ubuntu/mimi/certs:/etc/nginx/certs:ro
    ports:
      - '0.0.0.0:${FRONTEND_TLS_PORT:-8443}:8443'
    restart: unless-stopped
    logging: *vps-logging

# ---------------------------------------------------------------------------
# Upgrade path, once a hostname points at this server:
#   1. Point the DNS A record at 150.109.15.108.
#   2. Decide who owns :80/:443 — either fix or retire aire's dead nginx, or
#      have it proxy this stack. Do not let both bind the port.
#   3. Swap this overlay for docker-compose.prod.yml (Traefik + Let's Encrypt),
#      set DOMAIN and ACME_EMAIL, and drop FRONTEND_PUBLIC_PORT.
# Until then the stack answers on BOTH ports: 8080 plain HTTP (kept as the
# fallback, so a TLS misconfiguration can never take the box offline) and 8443
# HTTPS with a self-signed cert (a secure context, which is what unblocks
# geolocation, camera and PWA install). Neither is acceptable for real payroll
# data on a public address — that needs the hostname + Let's Encrypt path above.
# ---------------------------------------------------------------------------
