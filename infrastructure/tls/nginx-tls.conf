# TLS terminator for the shared VPS — the ONLY reason this file exists is that
# a browser refuses geolocation, camera and service-worker installation on an
# insecure origin, which today kills three shipped features on
# http://150.109.15.108:8080: driver truck tracking (live SJ positions),
# attendance selfie + GPS geofence from a phone, and PWA install on the outlet
# tablets. B-14.
#
# WHY A HIGH PORT (8443) AND NOT :443.
# `docker-compose.vps.yml` documents the constraint: ports 80/443 are free on
# this host ONLY because a neighbouring project's (aire) nginx has been
# crash-looping since 30 July. Claiming them would silently take over a port a
# neighbour still believes it owns, and would break them the moment they fix it.
# A high port costs an ugly URL and buys a secure context without touching
# anybody else's stack. When a real hostname exists, the Let's Encrypt path in
# `docker-compose.prod.yml` supersedes this whole file — see the upgrade note in
# the overlay.
#
# WHAT THIS PROXIES TO.
# Two things, on two ports.
#
# :8443 -> `frontend:3000`. The application's whole public surface is that one
# container: Next's own rewrites forward /api and /sync/v1 to the backend over
# the internal network.
#
# :8444 -> `minio:9000`. Object storage, and it needs its own ORIGIN rather than
# a path under :8443. The backend hands out presigned upload URLs, and SigV4
# signs the host AND the canonical path — so a proxy that strips a `/s3` prefix
# gives MinIO a different path than was signed and the upload fails the
# signature check. A separate port is the only way to keep the signed path
# identical to the received one.
#
# Without this, uploads were IMPOSSIBLE on the deployed box: presign returned
# `http://minio:9000/...`, a hostname no phone can resolve, over plain HTTP that
# an HTTPS page blocks as mixed content. `presign` still answered 200, so it
# looked like the camera was broken. Attendance selfies (mandatory, FR-HR-01)
# and waste photos (mandatory, FR-WST-01) both depend on this.

upstream mimi_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream mimi_minio {
    server minio:9000;
    keepalive 16;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    # Self-signed, generated on the host at deploy time (see deploy-vps.yml).
    # Browsers will warn once; after accepting, the origin IS a secure context,
    # which is what unblocks geolocation/camera/service workers. A self-signed
    # cert is NOT a substitute for a real one on a production hostname — it is
    # the difference between "cannot test the feature at all" and "can".
    ssl_certificate     /etc/nginx/certs/mimi.crt;
    ssl_certificate_key /etc/nginx/certs/mimi.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mimi_tls:10m;
    ssl_session_timeout 1h;

    # Photo evidence (attendance selfies, delivery handover, petty-cash
    # receipts) is uploaded through here. The default 1 MB would reject a
    # phone camera shot, and the failure would look like a broken feature
    # rather than a proxy limit.
    client_max_body_size 25m;

    # Long enough for a slow Kalimantan mobile upload to finish rather than be
    # cut off mid-photo.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://mimi_frontend;
        proxy_http_version 1.1;

        # socket.io drives the live topology tree and truck tracking; without
        # these two headers the WebSocket upgrade fails and those screens fall
        # back to polling or simply stop updating.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # `https`, from the real scheme — Next uses this to build absolute URLs,
        # and hardcoding it would produce http:// links the moment this file is
        # ever reused behind plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
    }
}

# ── object storage, on its own port so presigned signatures stay valid ────────
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/mimi.crt;
    ssl_certificate_key /etc/nginx/certs/mimi.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mimi_tls:10m;
    ssl_session_timeout 1h;

    # A phone-camera photo, with headroom. MinIO would accept more; the cap is
    # here so an accidental huge PUT is refused at the edge.
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://mimi_minio;
        proxy_http_version 1.1;

        # `$http_host`, NOT `$host`, and this one line is the whole proxy.
        #
        # SigV4 signs the Host header, so MinIO must see exactly what the client
        # signed: `150.109.15.108:8444`. nginx's `$host` LOWERCASES AND STRIPS
        # THE PORT, so it handed MinIO `150.109.15.108` and every upload came
        # back `SignatureDoesNotMatch` — a failure that reads like bad
        # credentials and is nothing of the kind. `$http_host` is the Host header
        # verbatim, port included.
        #
        # Rewriting it to `minio:9000` (the other tempting option) breaks the
        # same way, for the same reason.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streams the body straight through instead of buffering a whole photo
        # to disk first.
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
