# TLS terminator for the shared VPS — the ONLY reason this file exists is that
# a browser refuses geolocation, camera and service-worker installation on an
# insecure origin, which today kills three shipped features on
# http://150.109.15.108:8080: driver truck tracking (live SJ positions),
# attendance selfie + GPS geofence from a phone, and PWA install on the outlet
# tablets. B-14.
#
# WHY A HIGH PORT (8443) AND NOT :443.
# `docker-compose.vps.yml` documents the constraint: ports 80/443 are free on
# this host ONLY because a neighbouring project's (aire) nginx has been
# crash-looping since 30 July. Claiming them would silently take over a port a
# neighbour still believes it owns, and would break them the moment they fix it.
# A high port costs an ugly URL and buys a secure context without touching
# anybody else's stack. When a real hostname exists, the Let's Encrypt path in
# `docker-compose.prod.yml` supersedes this whole file — see the upgrade note in
# the overlay.
#
# WHAT THIS PROXIES TO.
# `frontend:3000` and nothing else. The stack's public surface is exactly one
# container: Next's own rewrites forward /api and /sync/v1 to the backend over
# the internal network, so terminating TLS in front of the frontend covers the
# whole application without publishing a second port.

upstream mimi_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    # Self-signed, generated on the host at deploy time (see deploy-vps.yml).
    # Browsers will warn once; after accepting, the origin IS a secure context,
    # which is what unblocks geolocation/camera/service workers. A self-signed
    # cert is NOT a substitute for a real one on a production hostname — it is
    # the difference between "cannot test the feature at all" and "can".
    ssl_certificate     /etc/nginx/certs/mimi.crt;
    ssl_certificate_key /etc/nginx/certs/mimi.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mimi_tls:10m;
    ssl_session_timeout 1h;

    # Photo evidence (attendance selfies, delivery handover, petty-cash
    # receipts) is uploaded through here. The default 1 MB would reject a
    # phone camera shot, and the failure would look like a broken feature
    # rather than a proxy limit.
    client_max_body_size 25m;

    # Long enough for a slow Kalimantan mobile upload to finish rather than be
    # cut off mid-photo.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://mimi_frontend;
        proxy_http_version 1.1;

        # socket.io drives the live topology tree and truck tracking; without
        # these two headers the WebSocket upgrade fails and those screens fall
        # back to polling or simply stop updating.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # `https`, from the real scheme — Next uses this to build absolute URLs,
        # and hardcoding it would produce http:// links the moment this file is
        # ever reused behind plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
    }
}
