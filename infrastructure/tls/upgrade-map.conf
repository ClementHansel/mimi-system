# nginx's WebSocket upgrade map. It lives in its own file because `map` is an
# http-level directive and everything mounted into conf.d is included INSIDE
# http — a `map` inside the server block in nginx-tls.conf would fail to start
# nginx at all. The `00-` prefix makes it load before the server that uses it.
#
# socket.io needs this: the live topology tree and the dispatcher's truck
# tracking both hold a WebSocket open, and without the mapped Connection header
# the upgrade is dropped and those screens silently stop updating.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
