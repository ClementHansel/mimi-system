# Traefik dynamic TLS configuration for the Mimi Chicken production VPS.
# Mounted read-only into the traefik container at /etc/traefik/dynamic
# (see docker-compose.prod.yml). Pattern copied from
# ../aivory/avry-vps-traefik/dynamic/tls-config.yml.
tls:
  options:
    default:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      sniStrict: true
      curvePreferences:
        - X25519
        - CurveP384
        - CurveP256
